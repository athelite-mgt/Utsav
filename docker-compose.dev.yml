# Local SQL Server for development and the isolation test suite.
#
# 2022 rather than Azure SQL Edge: Row-Level Security and
# sp_set_session_context must behave exactly as they will in production,
# and Edge omits features we depend on.
#
# The password comes from a git-ignored .env file (MSSQL_SA_PASSWORD).
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - utsav-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  utsav-sql:
