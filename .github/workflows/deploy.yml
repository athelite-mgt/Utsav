name: Build, test (incl. cross-tenant isolation), deploy to Azure App Service

on:
  push:
    branches: [main]
  # Lets a deploy be re-run by hand from the Actions tab without a new commit
  # — useful right after a portal-side config change (Application Settings,
  # SQL firewall rule) that doesn't touch the repo at all.
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  # This product is separate from the original single-committee app: it deploys to
  # its own App Service, authenticating with its own federated (OIDC) identity, so
  # there is no long-lived publish profile to leak.
  AZURE_WEBAPP_NAME: "Utsav"

jobs:
  # Runs on every push, including branches that never deploy — the point is
  # catching a break before it reaches the publish/deploy job at all, not
  # gating a specific environment.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Utsav.slnx

      - name: Build (warnings as errors — see Directory.Build.props)
        run: dotnet build Utsav.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Utsav.UnitTests --no-build --configuration Release

      # The isolation suite needs a real SQL Server (row-level security and
      # session context have to behave exactly as they will in production),
      # so it runs against a throwaway container with throwaway passwords.
      # It FAILS, rather than skips, when it cannot run: a cross-tenant leak
      # must never be able to slip through as an unconfigured, green build.
      - name: Generate throwaway database passwords
        run: |
          echo "MSSQL_SA_PASSWORD=Aa1!$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "UTSAV_APP_PASSWORD=Bb2!$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Start SQL Server
        run: docker compose -f docker-compose.dev.yml up -d --wait

      - name: Cross-tenant isolation tests
        run: dotnet test tests/Utsav.IsolationTests --no-build --configuration Release --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Utsav.Web/package-lock.json

      - name: Frontend type-check
        working-directory: src/Utsav.Web
        run: |
          npm ci
          npx tsc -b

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: it changes the OIDC subject claim to
    # "...:environment:production", which the Azure federated credential (created for
    # branch main by the Deployment Center) does not trust, and the login is refused.
    permissions:
      id-token: write # lets azure/login exchange the run's OIDC token for an Azure token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # dotnet publish shells out to npm itself (see the BuildAndCopyFrontend
      # target in Utsav.Api.csproj) — Node just has to be on PATH for it. No
      # sign-in settings are compiled in: the app serves its identity providers'
      # public client IDs from its own configuration (/api/auth/config).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Utsav.Web/package-lock.json

      - name: Publish (API + frontend into wwwroot)
        run: dotnet publish src/Utsav.Api --configuration Release --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_43FD789961984014BD0A8CF8F069AA55 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E226711D74F4F6B919492ABD4D22A5F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B0DDFBEE27EB4172992282F6C6742D57 }}

      # The schema is applied by the app itself on startup (Database__MigrateOnStartup),
      # using its own migration login, so a deploy is just this step. The request-serving
      # login stays least-privilege. See docs/DEPLOYMENT.md.
      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
